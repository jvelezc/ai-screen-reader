name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-prototype:
    name: Isolated public MCP prototype (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build isolated prototype
        run: pwsh -NoProfile -File scripts/Install-IsolatedReader.ps1 -Runtime docker
      - name: Prove namespace fence and proxy policy
        run: pwsh -NoProfile -File scripts/Test-ReaderIsolation.ps1 -Runtime docker | Set-Content artifacts/isolated/isolation.json
      - name: Exercise public task through real stdio MCP and sandboxed Chromium
        run: |
          pwsh -NoProfile -File scripts/Test-ReaderPrototype.ps1 -Runtime docker | Set-Content artifacts/isolated/public-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_MCP_ACCEPTANCE_FAILED' }
      - name: Retain acceptance receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-prototype-linux
          path: |
            artifacts/isolated/isolation.json
            artifacts/isolated/public-smoke.json
            artifacts/isolated/public-*-observation.json
          retention-days: 7
  verify:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore HeadlessScreenReader.slnx --locked-mode
      - name: Build
        run: dotnet build HeadlessScreenReader.slnx -c Release --no-restore
      - name: Check formatting
        run: dotnet format HeadlessScreenReader.slnx --verify-no-changes --no-restore
      - name: Install Chromium
        run: pwsh -NoProfile -File src/HeadlessScreenReader.Cli/bin/Release/net10.0/playwright.ps1 install chromium --with-deps
      - name: Permit sandboxed Chromium on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Ubuntu restricts user namespaces for downloaded browser binaries.
          # Allow only this runner's installed headless shell; keep ChromiumSandbox enabled.
          shopt -s nullglob
          browsers=("$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell)
          if [ "${#browsers[@]}" -ne 1 ]; then
            echo "Expected exactly one installed Chromium headless shell." >&2
            exit 1
          fi
          profile="$(mktemp)"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile hsr-playwright "${browsers[0]}" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r "$profile"
      - name: Test
        run: |
          dotnet test HeadlessScreenReader.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem artifacts/test-results -Filter *.trx)
          if ($reports.Count -eq 0) { throw "No test result files were produced." }
          foreach ($report in $reports) {
            [xml]$trx = Get-Content -LiteralPath $report.FullName -Raw
            $counts = $trx.TestRun.ResultSummary.Counters
            if ([int]$counts.total -le 0 -or [int]$counts.executed -ne [int]$counts.total -or [int]$counts.passed -ne [int]$counts.total) {
              throw "Expected every discovered test to execute and pass: $($report.Name)."
            }
            "${{ matrix.os }}: Discovered $($counts.total), passed $($counts.passed), failed $($counts.failed)." >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Exercise CLI
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build | Tee-Object -FilePath artifacts/demo.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --widgets | Tee-Object -FilePath artifacts/widgets.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --text | Tee-Object -FilePath artifacts/text.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --frames | Tee-Object -FilePath artifacts/frames.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --ranges | Tee-Object -FilePath artifacts/ranges.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --composites | Tee-Object -FilePath artifacts/composites.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --tables | Tee-Object -FilePath artifacts/tables.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --paragraphs | Tee-Object -FilePath artifacts/paragraphs.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --multiselect | Tee-Object -FilePath artifacts/multiselect.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --typeahead | Tee-Object -FilePath artifacts/typeahead.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --traversal | Tee-Object -FilePath artifacts/traversal.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --capture-probe | Tee-Object -FilePath artifacts/capture-probe.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --recording-sync | Tee-Object -FilePath artifacts/recording-sync.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --traversal-recording | Tee-Object -FilePath artifacts/traversal-recording.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check manual reference remains pending
        run: |
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --reference-template | Set-Content -Encoding utf8 artifacts/reference-template.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/HeadlessScreenReader.Cli -c Release --no-build -- --assess-reference artifacts/reference-template.json | Tee-Object -FilePath artifacts/reference-assessment.json
          if ($LASTEXITCODE -ne 3) { throw "An unrun reference worksheet must return exit code 3." }
          exit 0
      - name: Publish usable MCP prototype
        run: pwsh -NoProfile -File scripts/Install-ReaderPrototype.ps1 -SkipBrowserInstall -OutputDirectory (Join-Path $env:RUNNER_TEMP 'hsr-prototype')
      - name: Retain synthetic test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-${{ matrix.os }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
