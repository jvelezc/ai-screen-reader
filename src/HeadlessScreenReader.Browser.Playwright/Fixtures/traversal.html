<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic shop traversal fixture</title></head>
<body>
  <main>
    <h1>Synthetic shop</h1>
    <p>One synthetic item. No payment or external navigation occurs.</p>
    <button id="preview" data-hsr-feature="checkout-preview">Open checkout preview</button>
    <button id="validation" data-hsr-feature="checkout-validation">Checkout with missing address</button>
    <button id="unchanged" data-hsr-feature="checkout-without-feedback">Checkout without feedback</button>
    <button id="unlabelled" data-hsr-feature="account-settings"></button>
    <label>Account <input value="traversal-account-canary" type="text"></label>
    <label>Secret <input value="traversal-secret-canary" type="password"></label>
    <section id="checkout" hidden>
      <h2 id="destination" tabindex="-1">Checkout preview</h2>
      <p>This is a preview. No order was submitted.</p>
    </section>
    <div id="validation-dialog" role="dialog" aria-modal="true" aria-label="Address required" hidden>
      <h2 id="validation-heading" tabindex="-1">Address required</h2>
      <p>A missing address prevented the requested checkout preview.</p>
    </div>
    <button data-hsr-feature="checkout-unavailable" disabled>Unavailable checkout</button>
    <p>End of synthetic shop</p>
  </main>
  <script>
    document.getElementById('preview').addEventListener('click', () => {
      document.getElementById('checkout').hidden = false;
      document.getElementById('destination').focus();
    });
    document.getElementById('validation').addEventListener('click', () => {
      document.getElementById('validation-dialog').hidden = false;
      document.getElementById('validation-heading').focus();
    });
  </script>
</body>
</html>
