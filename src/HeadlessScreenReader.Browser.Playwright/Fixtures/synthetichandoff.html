<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Synthetic excluded-input fixture</title>
<style>html,body { margin:0; width:100%; height:100%; background:#20b840 } #tick { position:fixed; top:0; right:0 }</style>
<body><h1>Permitted before simulated assistance</h1>
<label for="synthetic-sensitive">Synthetic canary field</label><input id="synthetic-sensitive" type="password" autocomplete="off">
<span id="tick"></span>
<script>
window.contextMarker = Math.random().toString(36);
let tick = 0;
setInterval(() => document.querySelector('#tick').textContent = ++tick, 40);
document.querySelector('#synthetic-sensitive').addEventListener('input', event => {
  const present = event.target.value.length > 0;
  document.querySelector('h1').textContent = present ? event.target.value : 'Permitted after simulated assistance';
  document.documentElement.style.background = document.body.style.background = present ? '#e41a3d' : '#215ce0';
});
</script>
</body></html>
